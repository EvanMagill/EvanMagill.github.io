<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>increMod</title>
  </head>
  <body>
    <script type="text/javascript">
      var result = 0;
      var peakTotal = 0;
      var numPeaks = 0;
      function randomInt(min, max) {//Min and max inclusive. Thanks MDN!
        return Math.floor(Math.random() * (max - min + 1) + min);
      }
      function increMod(runs, min, max) {
        for(var i = 0; i < runs; i ++) {
          var newResult = (result + 1) % randomInt(min, max);
          if(newResult < result) {
            console.log("Peak: " + result);
            peakTotal += result;
            numPeaks ++;
          }
          result = newResult;
          console.log(result);
        }
        console.log("Current average peak: " + (peakTotal/numPeaks));
      }
      var computeTiming = setInterval(increMod, 100, 100)
    </script>
  </body>
</html>
