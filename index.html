<!DOCTYPE html>
<html>
  <head>
    <title>Evan Magill's website</title>
    <link rel="icon" type="image/x-icon" href="/efavicon.ico">
    <style>
      header {
        background: linear-gradient(0deg, rgba(0, 0, 0, 1) 0%, rgba(255, 255, 255, 1) 100%);
      }
      p {
        color: rgb(0, 0, 0);
      }
    </style>
  </head>
  <body>
    <header id="header">It's a header.</header>
    <p>Not the header.</p>
    <script>
      var changeCount = 0;
      var alwaysTrue = true;
      var header = document.querySelector("header");
      var style = document.querySelector("style");
      var tB = [[],[]];//top and bottom.
      for(var i = 0; i < 2; i ++) {
        for(var j = 0; j < 3; j ++) {
          tB[i][j] = Math.floor(Math.random() * 256);
        }
      }
      var text = [255 * (1 - Math.floor(tB[0][0] / 128)), 255 * (1 - Math.floor(tB[0][1] / 128)), 255 * (1 - Math.floor(tB[0][2] / 128))];
      var display = [[128, 128, 128], [128, 128, 128]];
      change = function() {
        if(changeCount % 3 == 0) {
          console.log("mod 3");
          for(var j = 0; j < 3; j ++) {
            for(var i = 0; i < 2; i ++) {
              tB[i][j] = Math.floor(Math.random() * 256);
            }
            text[j] = 255 * (1 - Math.floor(tB[0][j] / 128));
          }
          header.style.color = "rgb(" + text[0] + ", "  + text[1] + ", " + text[2] + ")";
        }else {
          console.log("normal");
          for(var j = 0; j < 3; j ++) {
            tB[1][j] = Math.floor(Math.random() * 256);
          }
        }
        changeCount ++;
        console.log("changeCount: " + changeCount + ",  text: [" + text[0] + ", "  + text[1] + ", " + text[2] + "]");
        console.log("top:    [" + tB[0][0] + ", "  + tB[0][1] + ", " + tB[0][2] + "]");
        console.log("bottom: [" + tB[1][0] + ", "  + tB[1][1] + ", " + tB[1][2] + "]");
      };
      approach = function() {
        for(var i = 0; i < 2; i ++) {
          for(var j = 0; j < 3; j ++) {
            if(display[i][j] < tB[i][j]) {
              display[i][j] ++;
            }else if (display[i][j] > tB[i][j]) {
              display[i][j] --;
            }
          }
        }
        if(changeCount < 5) {
          console.log("display top:    [" + display[0][0] + ", "  + display[0][1] + ", " + display[0][2] + "]");
          console.log("display bottom: [" + display[1][0] + ", "  + display[1][1] + ", " + display[1][2] + "]");
        }
        style.innerHTML = "header { background: linear-gradient(0deg, rgba(" + display[0][0] + ", " + display[0][1] + ", " + display[0][2] + ",1) 0%, rgba(" + display[1][0] + ", " + display[1][1] + ", " + display[1][2] + ",1) 100%); }";
      }
      if(alwaysTrue) {
        change();
        setInterval(change, 20000);
        setInterval(approach, 100);
      }else {
        clearInterval(change);
        clearInterval(approach);
      }
    </script>
  </body>
</html>
