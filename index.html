<!DOCTYPE html>
<html>
  <head>
    <title>Evan Magill's website</title>
    <link rel="icon" type="image/x-icon" href="/efavicon.ico">
  </head>
  <body>
    <header id="header">It's a header.</header>
    <script>
      var alwaysTrue = true;
      var body = document.querySelector("body");
      change = function() {
        var r = Math.floor(Math.random() * 256);
        var g = Math.floor(Math.random() * 256);
        var b = Math.floor(Math.random() * 256);
        body.style.backgroundColor = "rgb(" + r + ", " + g + ", " + b + ")";
        var textR = 255 * (1 - Math.floor(r / 128));
        var textG = 255 * (1 - Math.floor(g / 128));
        var textB = 255 * (1 - Math.floor(b / 128));
        body.style.color = "rgb(" + textR + ", "  + textG + ", " + textB + ")";
      };
      if(alwaysTrue) {
        change();
        setInterval(change, 20);
      }else {
        clearInterval(change);
      }
    </script>
  </body>
</html>
