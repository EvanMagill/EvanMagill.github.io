<!DOCTYPE html>
<html>
  <head>
    <link href="/style.css" type="text/css" rel="stylesheet" />
    <title>Evan Magill's website</title>
    <link rel="icon" type="image/x-icon" href="/efavicon.ico">
  </head>
  <body>
    <header id="header">It's a header.</header>
    <script>
      var header = document.querySelector("#header");
      change = function() {
        header.style.color = "rgb(" + Math.floor(Math.random() * 256) + "," + Math.floor(Math.random() * 256) + "," + Math.floor(Math.random() * 256) + ")";
      };
      setInterval(change, 100);
    </script>
  </body>
</html>
